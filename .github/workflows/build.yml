name: Build verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RedShirt.Example.FileDownload.sln

      - name: Build
        run: dotnet build RedShirt.Example.FileDownload.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RedShirt.Example.FileDownload.sln --no-build --configuration Release --verbosity normal
